<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stock Center - Organizador SL</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #141414; color: #ddd; margin: 0; padding: 12px; font-size: 13px; }
        .toolbar { background: #1e1e1e; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #2e2e2e; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .grid { display: grid; grid-template-columns: 280px 1fr; gap: 12px; height: 380px; }
        .column { background: #1e1e1e; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #2e2e2e; }
        .column h3 { margin: 0 0 8px 0; font-size: 13px; color: #fff; display: flex; justify-content: space-between; }
        .list-box { flex: 1; overflow-y: auto; background: #121212; border-radius: 4px; padding: 6px; border: 1px solid #282828; }
        .item-card { background: #262626; padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; }
        .item-card:hover { background: #333; }
        .item-card.selected { border-left-color: #0084ff; background: #1a2f45; }
        .tag-old { background: #d97706; color: #000; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 3px; }
        input[type="text"] { background: #121212; border: 1px solid #444; color: #fff; padding: 6px 8px; border-radius: 4px; }
        button { background: #007acc; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        button:hover { background: #005f9e; }
        .btn-warning { background: #d97706; color: #fff; }
        .btn-warning:hover { background: #b45309; }
        .btn-trash { background: #dc2626; color: #fff; }
        .btn-trash:hover { background: #b91c1c; }
        .btn-apply { background: #16a34a; font-size: 13px; width: 100%; padding: 10px; margin-top: 10px; font-weight: bold; }
        .btn-apply:hover { background: #15803d; }
        .folder-block { background: #161616; border: 1px solid #333; border-radius: 4px; padding: 8px; margin-bottom: 8px; }
        .folder-header { font-weight: bold; color: #38bdf8; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .trash-header { color: #f87171; }
        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #1e1e1e; border-radius: 6px; padding: 16px; max-width: 480px; width: 100%; max-height: 80vh; display: flex; flex-direction: column; border: 1px solid #444; }
        .modal-body { overflow-y: auto; flex: 1; margin: 12px 0; background: #121212; padding: 10px; border-radius: 4px; line-height: 1.5; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>

    <!-- Barra de Herramientas Inteligentes -->
    <div class="toolbar">
        <input type="text" id="filter" placeholder="Buscar por marca o nombre..." onkeyup="applyFilter()" style="flex: 1;">
        <button class="btn-warning" onclick="selectOldMesh()" title="Detecta XS, S, M, L, XL, Standard Size">🔍 Detectar Tallas Antiguas</button>
        <button style="background: #4b5563;" onclick="selectAllFiltered()">Seleccionar Todo</button>
        <button style="background: #374151;" onclick="clearSelection()">Desmarcar</button>
    </div>

    <div class="grid">
        <!-- Columna 1: Ítems por clasificar -->
        <div class="column">
            <h3>
                <span>Objetos en HUD</span>
                <span id="unassigned-count" style="color: #9ca3af; font-weight: normal;">0</span>
            </h3>
            <div id="unassigned-list" class="list-box">Cargando objetos desde el HUD...</div>
        </div>

        <!-- Columna 2: Carpetas y descartes -->
        <div class="column">
            <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                <input type="text" id="newFolderName" placeholder="Nombre de la carpeta..." style="flex: 1;">
                <button onclick="createFolder()">+ Crear</button>
                <button class="btn-trash" onclick="assignToTrash()">Mover a Descarte</button>
            </div>
            <div id="folders-container" class="list-box">
                <div class="folder-block">
                    <div class="folder-header trash-header">
                        <span>🗑️ Descarte (_POR_ELIMINAR_REVISAR)</span>
                        <span id="trash-count">0 ítems</span>
                    </div>
                    <div id="trash-list"></div>
                </div>
                <div id="user-folders"></div>
            </div>
        </div>
    </div>

    <button class="btn-apply" onclick="openConfirmModal()">Revisar y Autorizar Cambios en Second Life</button>

    <!-- Modal de Confirmación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Autorizar Organización Segura</h3>
            <p style="color: #bbb; margin-bottom: 8px;">Revisa las carpetas antes de la entrega final a tu inventario:</p>
            <div id="modalSummary" class="modal-body"></div>
            <div class="modal-actions">
                <button style="background: #4b5563;" onclick="closeModal()">Cancelar</button>
                <button class="btn-apply" style="width: auto; margin: 0;" onclick="submitFinalOrder()">Autorizar Entrega</button>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const slUrl = decodeURIComponent(params.get('sl_url'));

        let availableItems = [];
        let selectedItemNames = new Set();
        let createdFolders = [];
        let trashItems = [];

        // Patrón para detectar tallas antiguas mesh estándar
        const OLD_MESH_REGEX = /(\b(XS|S|M|L|XL)\b|standard\s*size|standard\s*sizing|classic\s*avatar)/i;

        async function init() {
            try {
                const res = await fetch(slUrl, { method: 'GET' });
                const data = await res.json();
                availableItems = data.map(i => decodeURIComponent(i));
                renderUnassigned();
            } catch(e) {
                document.getElementById('unassigned-list').innerText = "Esperando sincronización con el HUD...";
            }
        }

        function renderUnassigned() {
            const list = document.getElementById('unassigned-list');
            const query = document.getElementById('filter').value.toLowerCase();
            const filtered = availableItems.filter(item => item.toLowerCase().includes(query));
            
            document.getElementById('unassigned-count').innerText = `${filtered.length} / ${availableItems.length}`;
            list.innerHTML = "";

            filtered.forEach(name => {
                const isOld = OLD_MESH_REGEX.test(name);
                const card = document.createElement('div');
                card.className = 'item-card' + (selectedItemNames.has(name) ? ' selected' : '');
                
                card.innerHTML = `
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px;">${name}</span>
                    ${isOld ? '<span class="tag-old">Talla Antigua</span>' : ''}
                `;

                card.onclick = () => {
                    if (selectedItemNames.has(name)) selectedItemNames.delete(name);
                    else selectedItemNames.add(name);
                    renderUnassigned();
                };
                list.appendChild(card);
            });
        }

        function applyFilter() {
            renderUnassigned();
        }

        function selectOldMesh() {
            let matches = 0;
            availableItems.forEach(name => {
                if (OLD_MESH_REGEX.test(name)) {
                    selectedItemNames.add(name);
                    matches++;
                }
            });
            renderUnassigned();
            alert(`Se han detectado y seleccionado ${matches} objetos con formato de talla antigua.`);
        }

        function selectAllFiltered() {
            const query = document.getElementById('filter').value.toLowerCase();
            availableItems.filter(item => item.toLowerCase().includes(query)).forEach(name => {
                selectedItemNames.add(name);
            });
            renderUnassigned();
        }

        function clearSelection() {
            selectedItemNames.clear();
            renderUnassigned();
        }

        function createFolder() {
            const input = document.getElementById('newFolderName');
            const name = input.value.trim();
            if (!name) return alert("Asigna un nombre a la carpeta.");
            if (selectedItemNames.size === 0) return alert("Selecciona al menos un objeto.");

            createdFolders.push({ name: name, items: Array.from(selectedItemNames) });
            availableItems = availableItems.filter(i => !selectedItemNames.has(i));
            selectedItemNames.clear();
            input.value = "";

            renderUnassigned();
            renderFolders();
        }

        function assignToTrash() {
            if (selectedItemNames.size === 0) return alert("Selecciona los objetos que deseas descartar.");
            trashItems.push(...Array.from(selectedItemNames));
            availableItems = availableItems.filter(i => !selectedItemNames.has(i));
            selectedItemNames.clear();

            renderUnassigned();
            renderFolders();
        }

        function renderFolders() {
            document.getElementById('trash-count').innerText = `${trashItems.length} ítems`;
            document.getElementById('trash-list').innerHTML = trashItems.map(i => `<div style="color: #9ca3af; padding: 2px 4px;">• ${i}</div>`).join('');

            const container = document.getElementById('user-folders');
            container.innerHTML = createdFolders.map(f => `
                <div class="folder-block">
                    <div class="folder-header">
                        <span>📁 ${f.name}</span>
                        <span>${f.items.length} ítems</span>
                    </div>
                    <div>${f.items.map(it => `<div style="color: #9ca3af; padding: 2px 4px;">• ${it}</div>`).join('')}</div>
                </div>
            `).join('');
        }

        function openConfirmModal() {
            if (createdFolders.length === 0 && trashItems.length === 0) {
                return alert("No has agrupado carpetas ni marcado ítems para descarte.");
            }
            const summary = document.getElementById('modalSummary');
            let html = "";

            if (createdFolders.length > 0) {
                html += "<strong>Carpetas que se crearán:</strong><br>";
                createdFolders.forEach(f => {
                    html += `• <b>${f.name}</b> (${f.items.length} ítems)<br>`;
                });
            }

            if (trashItems.length > 0) {
                html += `<br><strong style="color: #f87171;">Descarte manual:</strong><br>`;
                html += `• <b>_POR_ELIMINAR_REVISAR</b> (${trashItems.length} ítems agrupados para que tú decidas tirarlos a la papelera)<br>`;
            }

            if (availableItems.length > 0) {
                html += `<br><span style="color: #fbbf24;">Pendientes: ${availableItems.length} ítems permanecerán en el HUD.</span>`;
            }

            summary.innerHTML = html;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        async function submitFinalOrder() {
            closeModal();
            try {
                const res = await fetch(slUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folders: createdFolders, trash: trashItems })
                });

                if (res.ok) {
                    alert("¡Organización completada! Revisa tu inventario de Second Life.");
                    location.reload();
                } else {
                    alert("El HUD no pudo procesar la solicitud.");
                }
            } catch(e) {
                alert("Error de comunicación con el HUD.");
            }
        }

        if (slUrl) init();
    </script>
</body>
</html>
